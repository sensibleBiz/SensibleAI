services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile

    container_name: sensible-crm-postgres

    restart: "no"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_admin_2026
      POSTGRES_DB: sensible_crm

    ports:
      - "5432:5432"

    volumes:
      - sensible_crm_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sensible_crm"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  sensible_crm_postgres_data:
